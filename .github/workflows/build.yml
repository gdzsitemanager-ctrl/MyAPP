name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare web assets
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js -o game/three.min.js
          cp game/three.min.js gameapp/src/main/assets/www/three.min.js
          cp game/index.html gameapp/src/main/assets/www/index.html
          mkdir -p messengerapp/src/main/assets/www
          cp messenger/index.html messengerapp/src/main/assets/www/index.html
      - name: Build APKs
        run: gradle :app:assembleDebug :gameapp:assembleDebug :messengerapp:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WebApkBuilder
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DroneWarfareFrontline-APK
          path: gameapp/build/outputs/apk/debug/gameapp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FRONTLINE-Messenger-APK
          path: messengerapp/build/outputs/apk/debug/messengerapp-debug.apk
